[package]
name = "reality-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
# `time`: the surface test bounds each probe, so a streaming route cannot hang it.
tokio = { version = "1.48.0", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
